# Disposable local proof only. Supply credentials in process environment, never build args.
services:
  postgres:
    image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    environment:
      POSTGRES_DB: drowk_runtime_test
      POSTGRES_USER: drowk
      POSTGRES_PASSWORD: ${DROWK_LOCAL_DB_PASSWORD:?local password required}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drowk -d drowk_runtime_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data
  migration:
    image: ${DROWK_API_IMAGE:?exact API image required}
    command: ["node", "node_modules/@drowk/db/dist/migrate-cli.js", "apply"]
    environment:
      APP_ENV: test
      DATABASE_URL: ${DROWK_LOCAL_DATABASE_URL:?local database URL required}
    depends_on:
      postgres:
        condition: service_healthy
  api:
    image: ${DROWK_API_IMAGE:?exact API image required}
    environment:
      APP_ENV: test
      HOST: 0.0.0.0
      PORT: "8000"
      AUTH_PROVIDER: none
      DATABASE_URL: ${DROWK_LOCAL_DATABASE_URL:?local database URL required}
    ports:
      - "127.0.0.1:${DROWK_LOCAL_API_PORT:-0}:8000"
    depends_on:
      migration:
        condition: service_completed_successfully
    stop_grace_period: 8s
  worker:
    image: ${DROWK_WORKER_IMAGE:?exact worker image required}
    environment:
      APP_ENV: test
    stop_grace_period: 8s
volumes:
  postgres-data:
networks:
  default:
    internal: true
