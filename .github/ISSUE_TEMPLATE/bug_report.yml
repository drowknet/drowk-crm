name: Bug report
description: Report a reproducible problem in DROWK CRM
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Do not include secrets, private datasets, tenant PII, or vulnerability details.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe reproduction you can.
      placeholder: Commands, synthetic fixture, or steps
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main, tag, or commit SHA
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node version, pnpm version, PostgreSQL version if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or evidence
      description: Redact credentials, tokens, private URLs, and personal data.
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: I have removed secrets, private data, and tenant PII.
          required: true
        - label: This is not a security vulnerability report.
          required: true
