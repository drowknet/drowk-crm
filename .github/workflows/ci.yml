name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "foundation/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Verify
        run: pnpm verify

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drowk_ci
          POSTGRES_USER: drowk
          POSTGRES_PASSWORD: drowk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drowk -d drowk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: drowk_ci
      PGUSER: drowk
      PGPASSWORD: drowk_ci_password
      DROWK_TEST_DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      DROWK_TEST_DISPOSABLE: "1"
      DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Build repositories
        run: pnpm build

      - name: Plan migrations
        run: pnpm --filter @drowk/db migrate plan

      - name: Apply migrations through runner
        run: pnpm --filter @drowk/db migrate apply

      - name: Check migration status
        run: pnpm --filter @drowk/db migrate status

      - name: Verify tenant isolation
        run: psql -v ON_ERROR_STOP=1 -f packages/db/test/0001_foundation.integration.sql

      - name: Verify migrations and repository persistence
        run: pnpm --filter @drowk/db test

      - name: Verify Gmail observation persistence boundary
        run: node --test connectors/gmail/test/persistence.integration.test.mjs

      - name: Verify runtime readiness
        run: pnpm --filter @drowk/api test
