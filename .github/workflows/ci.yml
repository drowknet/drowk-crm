name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "foundation/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm harness:ci

      - name: Verify runtime packaging
        run: pnpm runtime:verify

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drowk_ci
          POSTGRES_USER: drowk
          POSTGRES_PASSWORD: drowk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drowk -d drowk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: drowk_ci
      PGUSER: drowk
      PGPASSWORD: drowk_ci_password
      DROWK_TEST_DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      DROWK_TEST_DISPOSABLE: "1"
      DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same build, migration plan/apply/status, tenant SQL, DB persistence,
      # Gmail observation persistence and API/readiness sensors, now guarded.
      - name: Verify disposable PostgreSQL foundation
        run: pnpm harness:integration
