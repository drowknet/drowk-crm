name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
      - "foundation/**"
      - "feat/**"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm harness:ci

  postgres-foundation:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: drowk_ci
          POSTGRES_USER: drowk
          POSTGRES_PASSWORD: drowk_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drowk -d drowk_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PGHOST: 127.0.0.1
      PGPORT: 5432
      PGDATABASE: drowk_ci
      PGUSER: drowk
      PGPASSWORD: drowk_ci_password
      DROWK_TEST_DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      DROWK_TEST_DISPOSABLE: "1"
      DATABASE_URL: postgresql://drowk:drowk_ci_password@127.0.0.1:5432/drowk_ci
      APP_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Set up pnpm
        uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          version: 10.17.1

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Install
        run: pnpm install --frozen-lockfile

      # Same build, migration plan/apply/status, tenant SQL, DB persistence,
      # Gmail observation persistence and API/readiness sensors, now guarded.
      - name: Verify disposable PostgreSQL foundation
        run: pnpm harness:integration
